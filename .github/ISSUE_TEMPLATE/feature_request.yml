name: Feature request
description: Propose a feature or an improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or opportunity
      description: What video or workflow would this improve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Explain the desired behavior and user experience.
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser and platform
      placeholder: Optional - LibreWolf on Windows, Firefox on Linux, ...

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I would be willing to help implement this.
