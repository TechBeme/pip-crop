# Builds and lints the add-on and builds the Windows installer on every push
# and pull request. A tag vX.Y.Z (matching the version in
# extension/manifest.json) also publishes a GitHub release with the installer,
# the .xpi, the Firefox AutoConfig zip, updates.json (installed copies check it
# for updates) and SHA256SUMS.txt.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.build.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Build
        id: build
        env:
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$IS_TAG" = true ]; then
            python tools/build.py --repo "$GITHUB_REPOSITORY" --expect-version "${REF_NAME#v}"
          else
            python tools/build.py --repo "$GITHUB_REPOSITORY"
          fi

      - name: Check JavaScript syntax
        run: |
          node --check src/pipcrop.js
          node --check dist/extension/api.js
          node --check dist/firefox-autoconfig/defaults/pref/autoconfig.js
          # AutoConfig .cfg files are JavaScript
          cp dist/firefox-autoconfig/pipcrop.cfg "$RUNNER_TEMP/pipcrop.cfg.js"
          node --check "$RUNNER_TEMP/pipcrop.cfg.js"

      - name: Lint with Mozilla's add-on linter
        run: python tools/lint.py dist/extension

      - name: Check release notes
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          VERSION: ${{ steps.build.outputs.version }}
        run: python tools/changelog.py "$VERSION"

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: pip-crop-${{ steps.build.outputs.version }}
          path: |
            dist/*.xpi
            dist/*.zip
            dist/updates.json
            dist/SHA256SUMS.txt
          if-no-files-found: error

  installer:
    needs: quality
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build
        run: python tools/build.py --repo "$env:GITHUB_REPOSITORY"

      - name: Install Inno Setup
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download is-6_7_3 -R jrsoftware/issrc -p innosetup-6.7.3.exe -D "$env:RUNNER_TEMP"
          $exe = Join-Path $env:RUNNER_TEMP "innosetup-6.7.3.exe"
          $sig = Get-AuthenticodeSignature $exe
          if ($sig.Status -ne "Valid" -or $sig.SignerCertificate.Subject -notmatch "Pyrsys B\.V\.") {
            throw "Unexpected Inno Setup signature: $($sig.Status) $($sig.SignerCertificate.Subject)"
          }
          Start-Process $exe -Wait -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/CURRENTUSER", "/PORTABLE=1", "/DIR=$env:RUNNER_TEMP\innosetup"

      - name: Build the installer
        env:
          VERSION: ${{ needs.quality.outputs.version }}
        run: |
          & "$env:RUNNER_TEMP\innosetup\ISCC.exe" /Q "/DAppVersion=$env:VERSION" installer\pip-crop.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: pip-crop-setup-${{ needs.quality.outputs.version }}
          path: dist/*-setup.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [quality, installer]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download builds
        uses: actions/download-artifact@v8
        with:
          pattern: pip-crop-*${{ needs.quality.outputs.version }}
          merge-multiple: true
          path: dist

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.quality.outputs.version }}
        run: |
          (cd dist && sha256sum -- *-setup.exe >> SHA256SUMS.txt)
          python tools/changelog.py "$VERSION" > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" dist/* --verify-tag \
            --title "PiP Crop $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
