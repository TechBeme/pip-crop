<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <title>PiP Crop</title>
  <defs>
    <linearGradient id="o3-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E293B"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="o3-pip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#6366F1"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#o3-bg)"/>
  <!-- the page -->
  <rect x="16" y="22" width="96" height="70" rx="9" fill="#334155"/>
  <g fill="#64748B">
    <circle cx="26" cy="31" r="3"/>
    <circle cx="35" cy="31" r="3"/>
    <circle cx="44" cy="31" r="3"/>
  </g>
  <!-- the Picture-in-Picture window -->
  <rect x="52" y="57" width="52" height="32" rx="5" fill="#000" fill-opacity=".35"/>
  <rect x="52" y="54" width="52" height="32" rx="5" fill="url(#o3-pip)"/>
  <path d="M73 63L85 70L73 77Z" fill="#fff" stroke="#fff" stroke-width="3" stroke-linejoin="round"/>
  <!-- crop marks -->
  <g fill="none" stroke="#FBBF24" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M46 64V48H62"/>
    <path d="M110 76V92H94"/>
  </g>
