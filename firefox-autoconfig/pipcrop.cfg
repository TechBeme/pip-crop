// PiP Crop AutoConfig loader. Keep this first line a comment (AutoConfig skips it).
// Loads pipcrop.js from the Firefox installation folder once the first browser
// window has finished starting.
try {
  (function () {
    const file = Services.dirsvc.get("GreD", Components.interfaces.nsIFile);
    file.append("pipcrop.js");
    const url = Services.io.newFileURI(file).spec;
    const observer = {
      observe() {
        Services.obs.removeObserver(observer, "browser-delayed-startup-finished");
        try {
          const scope = {
            Services,
            ChromeUtils,
            Cc: Components.classes,
            Ci: Components.interfaces,
            Cu: Components.utils,
          };
          Services.scriptloader.loadSubScriptWithOptions(url, { target: scope, allowUnsafeURL: true });
          scope.PipCrop.install();
        } catch (e) {
          Components.utils.reportError(e);
        }
      },
    };
    Services.obs.addObserver(observer, "browser-delayed-startup-finished");
  })();
} catch (e) {
  Components.utils.reportError(e);
}
